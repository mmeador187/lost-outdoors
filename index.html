<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lost Outdoors - MVP Map</title>
  <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: sans-serif;
    }
    #map {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 100%;
    }
    .sidebar {
      position: absolute;
      top: 10px;
      left: 10px;
      background: white;
      padding: 10px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      z-index: 1;
    }
    .legend-row {
  cursor: pointer;
  user-select: none;
  margin: 6px 0;
}

.legend-toggle {
  display: inline-block;
  width: 14px;
  height: 14px;
  margin-right: 6px;
  vertical-align: middle;
  border-radius: 50%;
  border: 2px solid var(--layer-color);
  background: transparent;
}

.legend-toggle.on {
  background: var(--layer-color);
}
    .weather, .gear-list {
      margin-top: 10px;
      font-size: 14px;
    }
    .legend {
      margin-top: 10px;
      font-size: 13px;
      line-height: 1.4;
    }
    .legend-color {
      display: inline-block;
      width: 14px;
      height: 14px;
      margin-right: 6px;
      vertical-align: middle;
      border-radius: 3px;
    }
    #layerPanel {
      position: absolute;
      bottom: 60px;
      left: 10px;
      background: white;
      border: 1px solid #ccc;
      padding: 10px;
      display: none;
      z-index: 10;
    }
  
  #routePanel {
  position: absolute;
  top: 10px;
  right: 10px;
  background: white;
  padding: 10px;
  border-radius: 8px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
  z-index: 10;
  font-size: 14px;
}

#routePanel button {
  margin-top: 6px;
  width: 100%;
}
  </style>
</head>
<body>
  <div id="map"></div>
<div class="sidebar">
    <h3>Lost Outdoors</h3>
    <div class="weather">Weather: <span id="weather"></span></div>

<div class="legend">
  <h4>Map Layers</h4>

  <div class="legend-row" data-layer="trails-hiker">
    <span class="legend-toggle on" style="--layer-color:#28a745"></span>
    Hiker Trail
  </div>

  <div class="legend-row" data-layer="trails-bike">
    <span class="legend-toggle on" style="--layer-color:#ffc107"></span>
    Bike Trail
  </div>

  <div class="legend-row" data-layer="trails-horse">
    <span class="legend-toggle on" style="--layer-color:#a0522d"></span>
    Horse Trail
  </div>

  <div class="legend-row" data-layer="mvum-county">
    <span class="legend-toggle on" style="--layer-color:#DAA520"></span>
    County MVUM
  </div>

  <div class="legend-row" data-layer="mvum-forest-service">
    <span class="legend-toggle on" style="--layer-color:#0000FF"></span>
    Forest Service MVUM
  </div>
</div>
</div>
  
<div id="routePanel">
  <strong>Route Tool</strong><br>
  <div id="routeMiles">Miles: 0.0</div>
  <button id="routeModeBtn">Start Route</button>
  <button id="clearRouteBtn">Clear Route</button>
</div>

  <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
  <script>
    mapboxgl.accessToken = 'pk.eyJ1IjoibW1lYWRvcjE4NyIsImEiOiJjbWMyNzY0eXkwNWIyMmtxOGhrdndiNmwxIn0.ielEabL7E9CJEf5E9baQ4Q';
    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/outdoors-v12',
      center: [-88.688, 37.5],
      zoom: 12
    });
    map.addControl(new mapboxgl.NavigationControl());

    class LayersToggleControl {
      onAdd(map) {
        this._map = map;
        this._container = document.createElement('div');
        this._container.className = 'mapboxgl-ctrl mapboxgl-ctrl-group';
        this._container.style.display = 'flex';
        this._container.style.flexDirection = 'column';
        this._container.style.alignItems = 'center';

        this.isFollowing = false;
        this.watchId = null;
        this.userMarker = null;

        this.findMeBtn = document.createElement('button');
        this.findMeBtn.textContent = '📍 Find Me';
        this.findMeBtn.style.cssText = 'margin-bottom:8px;border:none;background:white;padding:6px 10px;border-radius:8px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,0.25);font-size:14px;';
        
        this.findMeBtn.addEventListener('click', () => {
  if (!this.isFollowing) {
    if (navigator.geolocation) {
      this.isFollowing = true;
      this.findMeBtn.textContent = '🛑 Stop Follow';

      // Get location immediately
      navigator.geolocation.getCurrentPosition(
        position => {
          const coords = [position.coords.longitude, position.coords.latitude];

          this._map.flyTo({
            center: coords,
            zoom: 18,
            pitch: 60,
            bearing: 90,
            speed: 1.5,
            essential: true
          });

          this.updateUserMarker(coords);

          // Then start watching position
          this.watchId = navigator.geolocation.watchPosition(
            pos => {
              const coords = [pos.coords.longitude, pos.coords.latitude];
              this._map.flyTo({
                center: coords,
                zoom: 18,
                pitch: 60,
                bearing: 90,
                speed: 1.5,
                essential: true
              });
              this.updateUserMarker(coords);
            },
            err => {
              console.error('watchPosition error:', err);
              alert('Unable to track your location.');
            },
            { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 }
          );
        },
        err => {
          console.error('getCurrentPosition error:', err);
          alert('Could not get your location.');
          this.isFollowing = false;
          this.findMeBtn.textContent = '📍 Find Me';
        },
        { enableHighAccuracy: true }
      );
    } else {
      alert('Geolocation is not supported by your browser.');
    }
  } else {
    // Stop follow mode
    this.isFollowing = false;
    this.findMeBtn.textContent = '📍 Find Me';

    if (this.watchId !== null) {
      navigator.geolocation.clearWatch(this.watchId);
      this.watchId = null;
    }

    this._map.easeTo({
      pitch: 0,
      bearing: 0,
      zoom: 14
    });
  }
});

        const layersButton = document.createElement('button');
        const icon = document.createElement('img');
        icon.src = 'https://raw.githubusercontent.com/mmeador187/lost-outdoors/main/assets/layers.png';
        icon.alt = 'Layers';
        icon.style.cssText = 'width:40px;height:40px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,0.25);cursor:pointer;object-fit:contain;';
        layersButton.appendChild(icon);
        layersButton.style.cssText = 'border:none;background:transparent;padding:0;display:flex;align-items:center;justify-content:center;';
        layersButton.addEventListener('click', () => {
          const panel = document.getElementById('layerPanel');
          panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
        });

        this._container.appendChild(this.findMeBtn);
        this._container.appendChild(layersButton);

        return this._container;
      }

      updateUserMarker(coords) {
        if (!this.userMarker) {
          this.userMarker = new mapboxgl.Marker({ color: '#0074D9' }).setLngLat(coords).addTo(this._map);
        } else {
          this.userMarker.setLngLat(coords);
        }
      }

      onRemove() {
        if (this.watchId) navigator.geolocation.clearWatch(this.watchId);
        if (this.userMarker) this.userMarker.remove();
        this._container.parentNode.removeChild(this._container);
        this._map = undefined;
      }
    }

    map.on('load', () => {
      map.addControl(new LayersToggleControl(), 'bottom-left');
      map.addSource('trails', { type: 'geojson', data: '/data/TrailsGeoJson.json' });
      map.addSource('mvum', { type: 'geojson', data: '/data/MVUM.json' });

      map.addLayer({ id: 'trails-hiker', type: 'line', source: 'trails', filter: ['in', 'Type2', 'Hiker Only Forest Service Trail', 'Hiker/Equestrian Forest Service Trail', 'Hiker/Mountain Bike Forest Service Trail'], paint: { 'line-color': '#28a745', 'line-width': 3 } });
      map.addLayer({ id: 'trails-horse', type: 'line', source: 'trails', filter: ['==', ['get', 'Type2'], 'Hiker/Equestrian Forest Service Trail'], paint: { 'line-color': '#a0522d', 'line-width': 2, 'line-offset': -2 } });
      map.addLayer({ id: 'trails-bike', type: 'line', source: 'trails', filter: ['==', ['get', 'Type2'], 'Hiker/Mountain Bike Forest Service Trail'], paint: { 'line-color': '#ffc107', 'line-width': 2 } });
      map.addLayer({ id: 'mvum-forest-service', type: 'line', source: 'mvum', filter: ['==', ['slice', ['get', 'JURISDICTI'], 0, 1], 'F'], paint: { 'line-color': '#0000FF', 'line-width': 3 } });
      map.addLayer({ id: 'mvum-county', type: 'line', source: 'mvum', filter: ['==', ['slice', ['get', 'JURISDICTI'], 0, 1], 'C'], paint: { 'line-color': '#DAA520', 'line-width': 3 } });

document.querySelectorAll('.legend-row').forEach(row => {
  row.addEventListener('click', () => {
    const layerId = row.dataset.layer;
    const toggle = row.querySelector('.legend-toggle');

    const visibility = map.getLayoutProperty(layerId, 'visibility');

    if (visibility === 'none') {
      map.setLayoutProperty(layerId, 'visibility', 'visible');
      toggle.classList.add('on');
    } else {
      map.setLayoutProperty(layerId, 'visibility', 'none');
      toggle.classList.remove('on');
    }
  });
});
      
let routeMode = false;
let routePoints = [];
let routeMarkers = [];

map.addSource('planned-route', {
  type: 'geojson',
  data: {
    type: 'Feature',
    geometry: {
      type: 'LineString',
      coordinates: []
    }
  }
});

map.addLayer({
  id: 'planned-route-line',
  type: 'line',
  source: 'planned-route',
  paint: {
    'line-color': '#ff0000',
    'line-width': 4,
    'line-dasharray': [2, 2]
  }
});

document.getElementById('routeModeBtn').onclick = () => {
  routeMode = !routeMode;
  document.getElementById('routeModeBtn').innerText = routeMode ? 'Stop Route' : 'Start Route';
};

document.getElementById('clearRouteBtn').onclick = () => {
  routePoints = [];
  routeMarkers.forEach(marker => marker.remove());
  routeMarkers = [];
  updateRouteLine();
  updateRouteMiles();
};

map.on('click', (e) => {
  if (!routeMode) return;

  const point = [e.lngLat.lng, e.lngLat.lat];
  routePoints.push(point);

  const marker = new mapboxgl.Marker({ color: '#ff0000' })
    .setLngLat(point)
    .addTo(map);

  routeMarkers.push(marker);

  updateRouteLine();
  updateRouteMiles();
});

function updateRouteLine() {
  map.getSource('planned-route').setData({
    type: 'Feature',
    geometry: {
      type: 'LineString',
      coordinates: routePoints
    }
  });
}

function updateRouteMiles() {
  let miles = 0;

  for (let i = 1; i < routePoints.length; i++) {
    miles += distanceInMiles(routePoints[i - 1], routePoints[i]);
  }

  document.getElementById('routeMiles').innerText = `Miles: ${miles.toFixed(1)}`;
}

function distanceInMiles(coord1, coord2) {
  const R = 3958.8;
  const lon1 = coord1[0] * Math.PI / 180;
  const lat1 = coord1[1] * Math.PI / 180;
  const lon2 = coord2[0] * Math.PI / 180;
  const lat2 = coord2[1] * Math.PI / 180;

  const dlon = lon2 - lon1;
  const dlat = lat2 - lat1;

  const a =
    Math.sin(dlat / 2) ** 2 +
    Math.cos(lat1) * Math.cos(lat2) *
    Math.sin(dlon / 2) ** 2;

  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}
          
      fetch('https://api.openweathermap.org/data/2.5/weather?lat=37.5&lon=-88.688&appid=374a4a81fc726009ff89323415d557e5&units=imperial')
        .then(res => res.json())
        .then(data => {
          document.getElementById('weather').innerText = `${data.weather[0].main}, ${data.main.temp.toFixed(0)}°F`;
        });
    });
  </script>
</body>
</html>
